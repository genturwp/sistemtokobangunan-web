[package]
name = "stb-web"
version = "0.1.0"
edition = "2024"
publish = false
description = "Website and licence service for SistemTokoBangunan"

[lib]
name = "stb_web"
path = "src/lib.rs"

[[bin]]
name = "stb-web"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
